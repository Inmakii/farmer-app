<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Farmer App{% endblock %}</title>
</head>
<body>
    <header>
        <nav aria-label="Główna nawigacja">
            <a href="{% url 'core:profile' %}">Farmer App</a>
            {% if user.is_authenticated %}
                <a href="{% url 'core:profile' %}">Profil</a>
                <a href="{% url 'core:field_list' %}">Moje pola</a>
                <a href="{% url 'core:cultivation_list' %}">Uprawy</a>
                <a href="{% url 'core:fieldwork_list' %}">Prace</a>
                <a href="{% url 'core:spraying_list' %}">Opryski</a>
                <a href="{% url 'core:harvest_list' %}">Zbiory</a>
                <a href="{% url 'core:report_dashboard' %}">Raporty</a>
                <form method="post" action="{% url 'core:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Wyloguj się</button>
                </form>
            {% else %}
                <a href="{% url 'core:login' %}">Logowanie</a>
                <a href="{% url 'core:register' %}">Rejestracja</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <section aria-label="Komunikaty">
            <ul>
                {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        </section>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
