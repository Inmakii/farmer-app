{% extends "core/base.html" %}

{% block title %}Usuń oprysk – Farmer App{% endblock %}

{% block content %}
    <h1>Usuń oprysk</h1>
    <p>Czy na pewno chcesz usunąć oprysk „{{ spraying.product_name }}” z dnia {{ spraying.spraying_date|date:"d.m.Y" }}?</p>
    <form method="post">{% csrf_token %}<button type="submit">Tak, usuń oprysk</button> <a href="{% url 'core:spraying_detail' spraying.pk %}">Anuluj</a></form>
{% endblock %}
