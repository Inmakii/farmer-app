{% extends "core/base.html" %}

{% block title %}Usuwanie pola – Farmer App{% endblock %}

{% block content %}
    <h1>Usuń pole</h1>
    <p>Czy na pewno chcesz usunąć pole „{{ field.name }}”?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Tak, usuń pole</button>
        <a href="{% url 'core:field_detail' field.pk %}">Anuluj</a>
    </form>
{% endblock %}
