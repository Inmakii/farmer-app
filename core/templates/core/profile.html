{% extends "core/base.html" %}

{% block title %}Profil – Farmer App{% endblock %}

{% block content %}
    <article>
        <h1>Twój profil</h1>
        <dl>
            <dt>Nazwa użytkownika</dt>
            <dd>{{ user.username }}</dd>
            <dt>Imię</dt>
            <dd>{{ user.first_name }}</dd>
            <dt>Nazwisko</dt>
            <dd>{{ user.last_name }}</dd>
            <dt>Adres e-mail</dt>
            <dd>{{ user.email }}</dd>
        </dl>
    </article>
{% endblock %}
