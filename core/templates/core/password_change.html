{% extends "core/base.html" %}

{% block title %}Zmiana hasła – Farmer App{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'core:profile' %}"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"/></svg>Wróć do profilu</a>
    <header class="page-head">
        <div>
            <p class="kicker">Konto</p>
            <h1>Zmień hasło</h1>
            <p class="page-head-lead">Nie trzeba logować się ponownie. Nowe hasło obowiązuje od razu.</p>
        </div>
    </header>

    <div class="sheet app-form">
        <form method="post" data-busy-form>
            {% csrf_token %}
            {% include "core/partials/form_body.html" %}
            <div class="form-actions">
                <button class="button" type="submit" data-busy-label="Zmienianie…">Zmień hasło</button>
                <a class="button button-text" href="{% url 'core:profile' %}">Anuluj</a>
            </div>
        </form>
    </div>
{% endblock %}
